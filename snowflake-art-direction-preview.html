const SAMPLE = Array.from('오늘도 스스로 정한 일을 끝냈고 조금 힘들었지만 나를 잘 돌본 하루였어 앞으로도 천천히 괜찮아');
const NS='http://www.w3.org/2000/svg';
let showMotion=!window.matchMedia('(prefers-reduced-motion: reduce)').matches, days=10, diaryCount=10, viewMode='airy';
const svg=document.querySelector('#art');
const make=(tag,attrs={},parent)=>{const el=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,String(v));parent?.appendChild(el);return el};
const hash=(a,b)=>{let v=Math.sin((a+1)*127.1+(b+1)*311.7)*43758.5453;return v-Math.floor(v)};
const selected=(amount)=>new Set(GROUPS.flatMap(g=>g.slots.map(s=>s.index)).sort((a,b)=>hash(a,108)-hash(b,108)).slice(0,amount));
function redraw(){
  svg.replaceChildren();
  const top=284-232*days/15;
  const defs=make('defs',{},svg),cp=make('clipPath',{id:'art-reveal'},defs);make('rect',{x:0,y:top,width:340,height:284-top},cp);
  const root=make('g',{'clip-path':'url(#art-reveal)'},svg);
  const budget=Math.min(192,52+diaryCount*9), ink=selected(viewMode==='dense'?budget:Math.round(budget*.75));
  GROUPS.forEach(g=>{const outer=make('g',{transform:`translate(${g.x} ${g.y}) rotate(${g.angle})`,class:'cluster'},root);
    const inner=make('g',{},outer);
    if(showMotion){const a=make('animateTransform',{attributeName:'transform',type:'rotate',values:`${-g.swayDegrees} 0 0; ${g.swayDegrees} 0 0; ${-g.swayDegrees} 0 0`,dur:`${g.periodSeconds}s`,begin:`-${g.phaseSeconds}s`,repeatCount:'indefinite'},inner);}
    g.slots.forEach(slot=>{if(!ink.has(slot.index))return;
      const t=make('text',{x:slot.x,y:slot.y,transform:`rotate(${slot.angleJitter} ${slot.x} ${slot.y})`,'dominant-baseline':'middle','text-anchor':'middle','font-size':(viewMode==='dense'?slot.size:slot.size*.9).toFixed(2),opacity:(viewMode==='dense'?slot.opacity:slot.opacity*.79).toFixed(2),fill:'#cad8dc'},inner);t.textContent=SAMPLE[Math.floor(hash(slot.index,23)*SAMPLE.length)%SAMPLE.length];
    });
  });
  document.querySelector('#days').textContent=String(days);
  document.querySelector('#status').textContent=`시연용 15일 기준 · ${days}일째 표현 · 일기 ${diaryCount}편`;
  document.querySelector('#motion').textContent=showMotion?'움직임 정지':'움직임 재생';
}
const slider=document.querySelector('#progress');slider.addEventListener('input',e=>{days=Number(e.target.value);diaryCount=Math.max(1,days);redraw()});
