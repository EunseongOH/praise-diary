name: Prototype quality checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main, feat/mvp-integration]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main, feat/design-system-prototype, feat/mvp-integration, feat/archive-f]

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify prototype
        run: npm run check
      - name: Prepare actual React review package
        run: node scripts/prepare-review.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser integration and design geometry
        run: npm run test:e2e
      - name: Upload collection visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-visual-evidence
          path: |
            test-results/**/collection-*.png
            test-results/**/diary-row-*.png
            test-results/**/archive-*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Upload verified React review
        uses: actions/upload-artifact@v4
        with:
          name: dajeongrok-react-review
          path: review/
          retention-days: 14
